location ^~ /robot/private/ {
    return 404;
}
location = /robot {
    return 301 /robot/;
}
location ^~ /robot/api/ {
    auth_basic "Private Robot RAG";
    auth_basic_user_file /www/sites/www.mzrc.online/robot/private/htpasswd;
    client_max_body_size 2m;
    limit_req zone=robot_api burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    add_header X-Accel-Buffering no;
}
location ^~ /robot/assets/ {
    auth_basic "Private Robot RAG";
    auth_basic_user_file /www/sites/www.mzrc.online/robot/private/htpasswd;
    alias /www/sites/www.mzrc.online/robot/public/assets/;
    expires 7d;
    add_header X-Content-Type-Options nosniff;
}
location ^~ /robot/ {
    auth_basic "Private Robot RAG";
    auth_basic_user_file /www/sites/www.mzrc.online/robot/private/htpasswd;
    alias /www/sites/www.mzrc.online/robot/public/;
    index index.html;
    try_files $uri $uri/ /robot/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
}
